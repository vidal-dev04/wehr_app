<div class="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">WeHR</h1>
      <p class="text-gray-600">Application de Gestion RH</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Error Message -->
      <div *ngIf="error" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
        {{ error }}
      </div>

      <!-- Email Field -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email
        </label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="input"
          [class.border-red-500]="f['email'].invalid && f['email'].touched"
          placeholder="admin@wehr.com"
        />
        <div *ngIf="f['email'].invalid && f['email'].touched" class="text-red-500 text-sm mt-1">
          <span *ngIf="f['email'].errors?.['required']">L'email est requis</span>
          <span *ngIf="f['email'].errors?.['email']">Email invalide</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Mot de passe
        </label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="input"
          [class.border-red-500]="f['password'].invalid && f['password'].touched"
          placeholder="••••••••"
        />
        <div *ngIf="f['password'].invalid && f['password'].touched" class="text-red-500 text-sm mt-1">
          <span *ngIf="f['password'].errors?.['required']">Le mot de passe est requis</span>
          <span *ngIf="f['password'].errors?.['minlength']">Minimum 6 caractères</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loading || loginForm.invalid"
        class="w-full btn btn-primary py-3 text-base font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="!loading">Se connecter</span>
        <span *ngIf="loading">Connexion en cours...</span>
      </button>
    </form>

    <!-- Info -->
    <div class="mt-6 text-center text-sm text-gray-600">
      <p>Utilisez: <strong>admin&#64;wehr.com</strong> / <strong>password</strong></p>
    </div>
  </div>
</div>
