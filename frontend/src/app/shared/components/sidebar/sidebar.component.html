<!-- Overlay pour mobile -->
<div 
  *ngIf="isOpen"
  class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
  (click)="toggleSidebar.emit()"
></div>

<!-- Sidebar -->
<aside 
  [class]="'fixed left-0 top-0 h-full bg-white border-r border-gray-200 transition-all duration-300 z-50 ' + (isOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0') + ' w-64'"
>
  <div class="flex flex-col h-full">
    <!-- Logo & Close Button -->
    <div class="p-6 border-b border-gray-200 flex items-center justify-between">
      <h1 class="text-2xl font-bold text-gray-900">WeHR</h1>
      <!-- Close button for mobile -->
      <button 
        (click)="toggleSidebar.emit()"
        class="lg:hidden p-2 hover:bg-gray-100 rounded-lg"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Main Menu -->
    <nav class="flex-1 overflow-y-auto p-4">
      <div class="mb-6">
        <p class="text-xs font-semibold text-gray-400 uppercase mb-3">Menu Principal</p>
        <ul class="space-y-1">
          <li *ngFor="let item of menuItems">
            <a
              (click)="navigate(item.route)"
              class="flex items-center px-4 py-3 rounded-lg cursor-pointer transition-colors"
              [class.bg-red-50]="item.active"
              [class.text-red-600]="item.active"
              [class.text-gray-600]="!item.active"
              [class.hover:bg-gray-50]="!item.active"
            >
              <span class="w-5 h-5 mr-3 flex items-center justify-center">
                <!-- Dashboard Icon -->
                <svg *ngIf="item.icon === 'dashboard'" class="w-5 h-5" [class.text-red-600]="item.active" [class.text-gray-600]="!item.active" fill="currentColor" viewBox="0 0 20 20">
                  <rect x="2" y="2" width="7" height="7" rx="1"/>
                  <rect x="11" y="2" width="7" height="7" rx="1"/>
                  <rect x="2" y="11" width="7" height="7" rx="1"/>
                  <rect x="11" y="11" width="7" height="7" rx="1"/>
                </svg>
                <!-- Users Icon (Recruitment) -->
                <svg *ngIf="item.icon === 'users'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <!-- Calendar Icon -->
                <svg *ngIf="item.icon === 'calendar'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <!-- User Icon (Employee) -->
                <svg *ngIf="item.icon === 'user'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                <!-- Building Icon (Department) -->
                <svg *ngIf="item.icon === 'building'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
              </span>
              <span class="font-medium">{{ item.label }}</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Other Menu -->
      <div>
        <p class="text-xs font-semibold text-gray-400 uppercase mb-3">Autre</p>
        <ul class="space-y-1">
          <li *ngFor="let item of otherItems">
            <a
              (click)="navigate(item.route)"
              class="flex items-center px-4 py-3 rounded-lg cursor-pointer transition-colors"
              [class.bg-red-50]="item.active"
              [class.text-red-600]="item.active"
              [class.text-gray-600]="!item.active"
              [class.hover:bg-gray-50]="!item.active"
            >
              <span class="w-5 h-5 mr-3 flex items-center justify-center">
                <!-- Headset Icon (Support) -->
                <svg *ngIf="item.icon === 'headset'" class="w-5 h-5" [class.text-red-600]="item.active" [class.text-gray-600]="!item.active" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <!-- Settings Icon -->
                <svg *ngIf="item.icon === 'settings'" class="w-5 h-5" [class.text-red-600]="item.active" [class.text-gray-600]="!item.active" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </span>
              <span class="font-medium">{{ item.label }}</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
</aside>
